<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=0.5, user-scalable=yes">
    <title>404 - Sayfa Bulunamadı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">
    <style>

        .error-404-content h1 {
            font-size: 6rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .error-404-content h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .error-404-content p {
            font-size: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div class="container text-center flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="error-404-content w-100">
            <h1>404</h1>
            <h2>Üzgünüz, aradığınız sayfa bulunamadı.</h2>
            <p>Erişmek istediğiniz sayfa sistemde bulununamadı. Sayfa silinmiş, başka bir adrese taşınmış ya da geçici olarak hizmet dışı kalmış olabilir.</p>
            <a href="/" class="btn btn-primary">
                <i class="bi bi-house-door"></i> Ana Sayfaya Dön
            </a>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
