name: Tanıtım seslerini üret ve indir
on:
  workflow_dispatch:
    inputs:
      sids:
        description: "Virgülle ayrılmış SID listesi"
        default: "TNT01,TNT02,TNT03,TNT04,TNT05,TNT06,TNT07,TNT08,TNT09,TNT10"
jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - name: Sesleri üret ve indir
        run: |
          mkdir -p ses
          B=https://kulturvarliklari.com.tr
          for s in $(echo "${{ github.event.inputs.sids }}" | tr ',' ' '); do
            for i in 1 2 3 4 5 6; do
              j=$(curl -s --max-time 60 -A "Mozilla/5.0 (kv-ses)" "$B/api/seslendir.php?sid=$s&lang=tr" || true)
              u=$(echo "$j" | python3 -c "import sys,json;print(json.load(sys.stdin).get('url',''))" 2>/dev/null || true)
              if [ -n "$u" ]; then curl -s --max-time 60 -A "Mozilla/5.0 (kv-ses)" -o "ses/$s.mp3" "$B/$u"; head -c 3 "ses/$s.mp3" | grep -q "ID3\|..." && break; fi
              echo "$s deneme $i: ${j:0:200}"; sleep 8
            done
          done
          ls -la ses
      - uses: actions/upload-artifact@v4
        with:
          name: tanitim-ses
          path: ses/
