name: Eksik aday
on:
  push:
    branches: [veri-eksik2]
    paths: [ek/spec.txt, ek/alt.json]
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f ek/alt.json ] && [ -f ek/meta.json ]; then python3 ek/tekrar.py; else python3 ek/getir.py; fi
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add ek && git commit -m "meta [skip ci]" && git push
