name: Eksik aday
on:
  push:
    branches: [veri-eksik]
    paths: [ek/spec.txt]
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 ek/getir.py
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add ek && git commit -m "meta [skip ci]" && git push
