# Depoya her gönderimde siteyi FTP ile hosting'e yükler.
# Gerekli gizli ayarlar (GitHub > Settings > Secrets and variables > Actions > Repository secrets):
#   Sunucu:       FTP_SERVER veya SERVER      (ör. ftp.kulturvarliklari.com.tr  — başına ftp:// yazmayın)
#   Kullanıcı:    FTP_USERNAME veya USERNAME
#   Şifre:        FTP_PASSWORD veya PASSWORD
name: Siteyi yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ayarları kontrol et
        id: ayar
        env:
          S1: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          S2: ${{ secrets.SERVER || vars.SERVER }}
          U: ${{ secrets.FTP_USERNAME || secrets.USERNAME || vars.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD || vars.FTP_PASSWORD }}
        run: |
          temizle() { echo "$1" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##'; }
          [ -z "$U" ] && { echo "::error::Kullanıcı adı ayarı yok (FTP_USERNAME veya USERNAME)."; exit 1; }
          [ -z "$P" ] && { echo "::error::Şifre ayarı yok (FTP_PASSWORD veya PASSWORD)."; exit 1; }
          HOST=""
          for aday in "$S1" "$S2" "ftp.kulturvarliklari.com.tr" "kulturvarliklari.com.tr"; do
            h=$(temizle "$aday"); [ -z "$h" ] && continue
            if getent hosts "$h" >/dev/null; then HOST="$h"; break; else echo "Bulunamadı: bir sunucu adresi çözülemedi, sıradakine geçiliyor."; fi
          done
          [ -z "$HOST" ] && { echo "::error::Sunucu adresi bulunamadı. FTP_SERVER / SERVER değerini kontrol edin (ör. ftp.kulturvarliklari.com.tr)."; exit 1; }
          echo "::add-mask::$HOST"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Ayarlar tamam."
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ayar.outputs.host }}
          username: ${{ secrets.FTP_USERNAME || secrets.USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftp           # hosting şifreli FTP (FTPS) desteklemiyor
          server-dir: ./          # FTP hesabının klasörü public_html olarak ayarlandı
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml
            README.md
            KURULUM.md
            api/config.php
