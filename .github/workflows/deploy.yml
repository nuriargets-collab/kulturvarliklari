# Depoya her gönderimde siteyi FTP ile hosting'e yükler.
# Gerekli gizli ayarlar (GitHub > Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Siteyi yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # hosting FTPS desteklemiyorsa "ftp" yapın
          server-dir: ./          # FTP hesabının klasörü public_html olarak ayarlandı
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml
            README.md
            KURULUM.md
            api/config.php
