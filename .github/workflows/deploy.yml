# Depoya her gönderimde siteyi FTP ile hosting'e yükler.
# Gerekli gizli ayarlar (GitHub > Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Siteyi yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ayarları kontrol et
        env:
          S: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
        run: |
          eksik=""
          [ -z "$S" ] && eksik="$eksik FTP_SERVER"
          [ -z "$U" ] && eksik="$eksik FTP_USERNAME"
          [ -z "$P" ] && eksik="$eksik FTP_PASSWORD"
          if [ -n "$eksik" ]; then
            echo "::error::Eksik ayar:$eksik  -> Settings > Secrets and variables > Actions > Repository secrets bolumune tam bu adlarla ekleyin."
            exit 1
          fi
          echo "Uc ayar da bulundu."
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftps          # hosting FTPS desteklemiyorsa "ftp" yapın
          server-dir: ./          # FTP hesabının klasörü public_html olarak ayarlandı
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml
            README.md
            KURULUM.md
            api/config.php
