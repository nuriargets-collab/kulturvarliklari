name: KKTC gorsel topla
on:
  push:
    branches: [kktc-gorsel]
    paths: [kktc/liste.tsv, kktc/getir.py]
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 kktc/getir.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add kktc && git commit -m "KKTC gorsel adaylari [skip ci]" && git push
